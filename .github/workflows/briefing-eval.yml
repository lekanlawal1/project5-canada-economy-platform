name: Briefing evaluation

# Manual only: runs the AI briefing N times on real data through the verifier and reports
# pass rates, failures and timings in the job summary. Evidence for docs/06_briefing.md.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of briefings to generate
        default: "10"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.ingest
      - run: python -m src.build
      - run: python -m src.forecast
      - name: Evaluate
        run: python -m src.briefing_eval --runs ${{ inputs.runs }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
