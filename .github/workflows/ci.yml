name: CI

# Runs on every push and pull request. Two jobs:
#   unit-tests: offline, seconds. Proves the code and SQL logic on hand-made data.
#   data-tests: downloads the real StatCan tables, builds the warehouse and runs the data
#               tests. Proves the live data still fits our assumptions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runner pinned to ubuntu-24.04 rather than ubuntu-latest so an image change (latest moves to
# Ubuntu 26 on 2026-10-19) cannot alter the pipeline without a reviewed commit.
permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  data-tests:
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download StatCan tables
        run: python -m src.ingest
      - name: Build warehouse
        run: python -m src.build
      - name: Forecasts and backtest
        run: python -m src.forecast
      - name: Data tests
        run: python -m src.data_tests
